root = "."
tmp_dir = "bin"

[build]
cmd = "go tool templ generate && go build -o ./bin/planbee ."
entrypoint = ["./bin/planbee"]
delay = 1000
exclude_dir = ["bin", "tmp", ".git"]
exclude_file = []
exclude_regex = ["_test\\.go", "_templ\\.go"]
include_ext = ["go", "templ", "html", "css", "js"]
kill_delay = "500ms"
log = "air-build.log"
poll = false
rerun = false
send_interrupt = true
stop_on_error = true

[log]
main_only = false
time = true

[screen]
clear_on_rebuild = true
keep_scroll = true
