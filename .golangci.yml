---
# Configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 1m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # https://golangci-lint.run/usage/configuration/#linters-configuration
  default: all

  # explicitly disabled linters
  disable:
    # - containedctx
    # Complexity and function-size checks are deferred while boundaries settle.
    - cyclop
    - depguard
    - dupl    # Disabled due to ongoing refactoring and code duplication is temporarily tolerated.
    - err113   # Enable incrementally after caller-visible sentinels are defined.
    - exhaustruct #deprecated, replaced by exhaustruct_v2
    - exhaustruct_v5
    - exhaustive
    - forbidigo
    # - funlen
    # - gocognit
    - nestif
    - goconst  # Revisit after workflow boundaries stabilize.
    - godox
    - godoclint
    - gomodguard #deprecated; replaced by gomodguard_v2
    # - lll  # Formatting is handled by gofmt/gofumpt.
    - mnd
    - noinlineerr
    - paralleltest
    - testpackage #temporarily disabled
    - varnamelen
    - wrapcheck # Enable incrementally at package boundaries.
    - wsl #deprecated; replaced by wsl_v5

  settings:
    cyclop:
      max-complexity: 12

    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Close

    funlen:
      lines: 80
      statements: 60
      ignore-comments: true

    gomoddirectives:
      replace-allow-list:
        - github.com/slok/go-http-metrics

    gosec:
      excludes:
        - G104 # Errors unhandled
        - G304 # Potential file inclusion via variable (see https://github.com/golang/go/issues/67002)

    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - generic
        - proto.Message
        - plugins.Plugin

    lll:
      line-length: 150

    recvcheck:
      exclusions:
        - "*.Map"

    revive:
      rules:
        - name: package-comments
          disabled: true
          
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

  exclusions:
    generated: lax
    rules:
      - path: internal/ecb/client\.go
        text: "package-comments: should have a package comment"
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
